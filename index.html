<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="google-site-verification" content="PEaWi4tby5Om4aznyLy4aJ27a1YhdefZu8lGAI2YXaU" />
<title>Kattenspellen — Cat puzzle games</title>
<meta name="description" content="Kattenspellen (Dutch for &quot;cat games&quot;): free-to-play cat puzzle games. No ads, no telemetry — play right in your browser.">
<link rel="canonical" href="https://kattenspellen.github.io/games/">
<meta property="og:type" content="website">
<meta property="og:title" content="Kattenspellen — Cat puzzle games">
<meta property="og:description" content="Free-to-play cat puzzle games. No ads, no telemetry — play right in your browser.">
<meta property="og:url" content="https://kattenspellen.github.io/games/">
<meta property="og:image" content="https://kattenspellen.github.io/games/icon-512.png">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://kattenspellen.github.io/games/icon-512.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#f7a8c4">
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root {
    --bg: #fdf6f0;
    --ink: #5b4a52;
    --panel: #ffffff;
    --accent: #f7a8c4;
    --accent-2: #3f8fd6;
    --shadow: 0 6px 20px rgba(120,90,110,.15);
  }
  /* emoji draw as Google's Noto art (see "emoji images" in the script); each SVG frames the font's line box,
     so this sizes and shifts it to sit where the glyph would */
  img.emo { width: 1.172em; height: 1.172em; margin: -.086em .037em; vertical-align: -.158em; pointer-events: none; -webkit-user-drag: none; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: linear-gradient(160deg,#fdf6f0,#f5eefb);
    color: var(--ink);
    font-family: "Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
    min-height: 100%;
  }
  body { display: flex; flex-direction: column; align-items: center; padding: 40px 12px; }
  h1 { font-size: 2.4rem; margin: 8px 0 4px; letter-spacing: 1px; }
  p.sub { margin: 0 0 32px; opacity: .7; }
  .games { display: flex; flex-wrap: wrap; gap: 20px; justify-content: center; width: 100%; max-width: 720px; }
  a.card {
    display: block; text-decoration: none; color: var(--ink);
    background: var(--panel); border-radius: 20px; padding: 24px;
    box-shadow: var(--shadow); width: 220px; transition: transform .12s;
  }
  a.card:hover { transform: translateY(-4px); }
  a.card .emoji { font-size: 2.6rem; }
  a.card h2 { margin: 10px 0 6px; font-size: 1.4rem; color: var(--accent); }
  a.card.catwalk h2 { color: #2b9d9d; }
  a.card.meowsweeper h2 { color: #5b8dee; }
  a.card.purrlink h2 { color: #6b3fa0; }
  a.card.kattenratten h2 { color: #4b4f9e; }
  a.card p { margin: 0; font-size: .95rem; opacity: .75; }
  /* phones: 2-up cards (the odd last one centers); under 360px they stay 1-up */
  @media (min-width:360px) and (max-width:519px) {
    .games { gap: 12px; }
    a.card { width: calc(50% - 6px); padding: 14px; }
    a.card h2 { font-size: 1.1rem; }
  }
  .btn {
    border: none; cursor: pointer; font-family: inherit; font-weight: 800; font-size: .9rem;
    padding: 9px 16px; border-radius: 12px; background: var(--panel); color: var(--ink);
    box-shadow: var(--shadow); transition: transform .12s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn.primary { background: var(--accent-2); color: #fff; }
  .btn[hidden] { display: none; }
  #installBtn { margin: -16px 0 28px; }
  .overlay {
    position: fixed; inset: 0; background: rgba(70,50,65,.4);
    display: none; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .overlay.show { display: flex; }
  .overlay .card {
    background: var(--panel); border-radius: 20px; padding: 26px; max-width: 360px;
    box-shadow: 0 20px 50px rgba(0,0,0,.25); text-align: center; animation: pop .3s ease;
  }
  .overlay .card p { line-height: 1.5; font-size: .92rem; margin: 8px 0; text-align: left; }
  .winbtns { display: flex; gap: 8px; justify-content: center; margin-top: 6px; flex-wrap: wrap; }
  @keyframes pop { 0%{transform:scale(.2) rotate(-18deg);opacity:0;} 60%{transform:scale(1.18) rotate(6deg);} 100%{transform:scale(1) rotate(0);} }
</style>
</head>
<body>
  <h1>Kattenspellen</h1>
  <p class="sub">Cat puzzle games.</p>
  <button class="btn primary" id="installBtn" hidden>📲 Install as an app</button>
  <div class="games">
    <a class="card" href="catoku/">
      <div class="emoji">🐱</div>
      <h2>Catoku</h2>
      <p>A "Queens"-style logic puzzle.</p>
    </a>
    <a class="card catwalk" href="catwalk/">
      <div class="emoji">🐾</div>
      <h2>Catwalk</h2>
      <p>A "Train Tracks"-style logic puzzle.</p>
    </a>
    <a class="card meowsweeper" href="meowsweeper/">
      <div class="emoji">🙀</div>
      <h2>Meowsweeper</h2>
      <p>A "Minesweeper"-style logic puzzle.</p>
    </a>
    <a class="card purrlink" href="purrlink/">
      <div class="emoji">🧶</div>
      <h2>Purrlink</h2>
      <p>A "Numberlink"-style logic puzzle.</p>
    </a>
    <a class="card kattenratten" href="kattenratten/">
      <div class="emoji">🐭</div>
      <h2>Kattenratten</h2>
      <p>A "Tents"-style logic puzzle.</p>
    </a>
  </div>

  <div class="overlay" id="installOverlay">
    <div class="card">
      <p id="installSteps"></p>
      <div class="winbtns">
        <button class="btn" id="noInstallBtn">Don't show again</button>
        <button class="btn primary" onclick="document.getElementById('installOverlay').classList.remove('show')">Got it!</button>
      </div>
    </div>
  </div>
<script>
"use strict";

/* ---------- emoji images ---------- */
// Every emoji draws as Google's Noto art from assets/emoji/ (built by scripts/build-emoji.py), so it looks the same on every
// device with no font support needed. The page's text keeps plain emoji; this swaps each for an <img>, at load and whenever
// the page adds more. An image that can't load shows its alt: the device's own emoji.
const EMOJI_DIR = "assets/emoji/";
const EMOJI_RE = /[\u{1F000}-\u{1FAFF}\u2600-\u262F\u2631-\u26FF\u2705\u274C\u2B50\u2B55\u2B06]\uFE0F?/gu; // same set as build-emoji.py
function emojify(root) {
  if (!root || !root.isConnected) return;
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), hits = [];
  for (let n; (n = w.nextNode());) if (n.data.search(EMOJI_RE) >= 0 && !n.parentNode.closest("script,style")) hits.push(n);
  for (const n of hits) {
    const f = document.createDocumentFragment(); let i = 0;
    for (const m of n.data.matchAll(EMOJI_RE)) {
      if (m.index > i) f.append(n.data.slice(i, m.index));
      const img = document.createElement("img"); img.className = "emo"; img.alt = m[0]; img.draggable = false;
      img.src = EMOJI_DIR + m[0].codePointAt(0).toString(16) + ".svg"; f.append(img); i = m.index + m[0].length;
    }
    if (i < n.data.length) f.append(n.data.slice(i));
    n.replaceWith(f);
  }
}
if (typeof document !== "undefined" && typeof MutationObserver !== "undefined") {
  emojify(document.body);
  new MutationObserver(ms => { for (const m of ms) for (const n of m.type === "characterData" ? [m.target] : m.addedNodes) emojify(n.nodeType === 3 ? n.parentNode : n); })
    .observe(document.body, { childList: true, subtree: true, characterData: true });
  // Once the page has loaded, fetch every emoji it can show (in its HTML or script) so one that appears mid-game draws at once.
  addEventListener("load", () => { for (const e of new Set(document.documentElement.innerHTML.match(EMOJI_RE))) new Image().src = EMOJI_DIR + e.codePointAt(0).toString(16) + ".svg"; });
}

/* ---------- install as an app ---------- */
// Chrome on Android installs through its own prompt; other phone browsers get the steps in a card.
// Hidden inside the installed app, on desktop, and once the player picks "Don't show again".
const STORE_KEY = "kattenspellen_v1"; // { noInstall: true } once dismissed
function loadStore() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch (e) { return {}; } }
const installBtn = document.getElementById("installBtn"), installOverlay = document.getElementById("installOverlay");
let installPrompt = null;
if (!(matchMedia("(display-mode: standalone)").matches || navigator.standalone) && !loadStore().noInstall) {
  const ua = navigator.userAgent;
  const ios = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const steps = ios ? (/CriOS/.test(ua) ? "Tap Share ⬆️ in the address bar, then Add to Home Screen."
      : /FxiOS/.test(ua) ? "Tap the menu ☰, then Share, then Add to Home Screen."
      : /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS|OPT\/|DuckDuckGo|GSA/.test(ua) ? "Tap Share ⬆️, then Add to Home Screen." : "")
    : /Android/.test(ua) && /Firefox/.test(ua) ? "Tap the menu ⋮, then Add to Home screen." : "";
  if (steps) { document.getElementById("installSteps").textContent = steps; installBtn.hidden = false; }
  if (/Android/.test(ua)) { // desktop Chrome fires these too; keep the button to phones
    addEventListener("beforeinstallprompt", e => { e.preventDefault(); installPrompt = e; installBtn.hidden = false; });
    addEventListener("appinstalled", () => { installBtn.hidden = true; });
  }
}
installBtn.onclick = () => {
  if (installPrompt) { installPrompt.prompt(); installPrompt = null; installBtn.hidden = true; } // a prompt is single-use; Chrome re-fires the event if still installable
  else installOverlay.classList.add("show");
};
document.getElementById("noInstallBtn").onclick = () => {
  const s = loadStore(); s.noInstall = true;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
  installBtn.hidden = true; installOverlay.classList.remove("show");
};
// click the backdrop (outside the card) to dismiss
installOverlay.addEventListener("click", e => { if (e.target === installOverlay) installOverlay.classList.remove("show"); });
</script>
</body>
</html>
